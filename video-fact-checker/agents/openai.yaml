interface:
  display_name: "视频事实审查"
  short_description: "核验事实，提炼经验并输出分阶段实施路径"
  default_prompt: "Use $video-fact-checker to verify this video topic, trace claims to ranked sources, scope negative findings, and for case-based work extract evidence-bounded transferable lessons plus a clearly labeled staged implementation path with assumptions, human controls, difficulty and scale gates. Never omit the path silently: use insufficient_evidence with blockers when needed. Produce a validated traceable fact card."
policy:
  allow_implicit_invocation: true
