  short_description: "核验事实并提炼有证据边界的可复用经验"
  default_prompt: "Use $video-fact-checker to verify this video topic, trace claims to ranked sources, scope negative findings, and for case-based work extract evidence-bounded transferable lessons with conditions, difficulty, a minimum pilot, and evaluation signals. Produce a validated traceable fact card."
